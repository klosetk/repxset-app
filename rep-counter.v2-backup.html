<title>Rep Counter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow phone-first column; header with back + step, content, sticky action bar at the bottom. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --fg:#11151D; --muted:#5A6374; --line:#DADFE8;
  --accent:#2A4BDB; --accent-fg:#FFFFFF; --accent-soft:#E3E8FC;
  --rest:#0B8F72; --rest-soft:#DDF3EC;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F15; --surface:#151922; --fg:#EDF0F5; --muted:#8E97A8; --line:#252B37;
  --accent:#7290FF; --accent-fg:#0C0F15; --accent-soft:#1C2445;
  --rest:#3CCFA6; --rest-soft:#0F2A24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F15; --surface:#151922; --fg:#EDF0F5; --muted:#8E97A8; --line:#252B37;
  --accent:#7290FF; --accent-fg:#0C0F15; --accent-soft:#1C2445;
  --rest:#3CCFA6; --rest-soft:#0F2A24; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding-block:14px 6px;min-height:56px}
.back{background:none;border:1px solid var(--line);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.step{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:14px}
main{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:8px 24px}
h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0;letter-spacing:.01em}
.sub{color:var(--muted);margin:0}
.list{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.opt .t{font-weight:600;font-size:18px}
.opt .d{color:var(--muted);font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.check{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"] .check{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-weight:500;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-size:22px;line-height:1}
.stepper output{font-family:var(--display);font-weight:700;font-size:28px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.field{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.tip p{margin:0;font-size:17px;line-height:1.45}
select.field{appearance:auto}
.note{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--muted);color:var(--muted);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.bar{position:sticky;bottom:0;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.primary{width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;padding:16px}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-weight:600}

/* Home */
.home{justify-content:center;gap:28px}
.mark{font-family:var(--display);font-weight:700;font-size:72px;line-height:.9;letter-spacing:-.02em;margin:0}
.mark span{color:var(--accent)}
.plates{display:flex;gap:6px;align-items:center}
.plates i{display:block;width:10px;border-radius:3px;background:var(--fg)}
.last{font-size:14px;color:var(--muted)}

/* Workout */
.wo{gap:14px;text-align:center}
.wo-top{display:flex;flex-direction:column;gap:4px;align-items:center}
.wo-name{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;margin:0}
.wo-meta{color:var(--muted);font-weight:500}
.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.track>b{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.phase{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:16px;color:var(--accent)}
.wo.is-rest .phase{color:var(--rest)}
.clock{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:min(34vw,170px);line-height:.9;letter-spacing:-.02em}
.wo.is-rest .clock{color:var(--rest)}
.rep{font-family:var(--display);font-weight:600;font-size:30px;font-variant-numeric:tabular-nums}
.rep b{font-size:56px;font-weight:700}
.beat{height:10px;background:var(--line);border-radius:10px;overflow:hidden;max-width:320px;width:100%;margin:0 auto}
.beat>b{display:block;height:100%;background:var(--accent);width:0}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:340px;margin:0 auto}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.next{color:var(--muted);font-size:15px}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctrls .primary{grid-column:1/-1}
.pulse{animation:pulse .18s ease-out}
@keyframes pulse{from{transform:scale(1.04)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.track>b{transition:none}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.field.wt{width:120px;flex:none;text-align:right}
</style>

<script>
const EQUIP = {weights:'Weights', cable:'Cable machine', band:'Resistance band', kettlebell:'Kettlebell', machine:'Machine', none:'None'};
const DEF = {w:'weights',c:'cable',b:'band',k:'kettlebell',m:'machine',n:'none'};
// "Name:default equipment" — every exercise can still use any equipment.
const RAW = {
  upper:['Upper body','Chest, back, shoulders, arms',`Arnold press:w|Bench press:w|Bent-over row:w|Bicep curl:w|Cable crossover:c|Chest dip:n|Chest fly:w|Chest press:m|Chin-up:n|Close-grip bench press:w|Concentration curl:w|Decline bench press:w|Diamond push-up:n|Face pull:c|Front raise:w|Hammer curl:w|Incline bench press:w|Incline dumbbell fly:w|Lat pulldown:c|Lateral raise:w|Overhead press:w|Overhead tricep extension:w|Pec deck:m|Preacher curl:w|Pull-up:n|Pullover:w|Push-up:n|Rear delt fly:w|Reverse curl:w|Seated cable row:c|Shoulder press:w|Shrug:w|Single-arm row:w|Skull crusher:w|Straight-arm pulldown:c|T-bar row:w|Tricep dip:n|Tricep kickback:w|Tricep pushdown:c|Upright row:w`],
  lower:['Lower body','Quads, hamstrings, glutes, calves',`Box jump:n|Bulgarian split squat:w|Calf raise:w|Clamshell:b|Curtsy lunge:w|Deadlift:w|Donkey kick:n|Fire hydrant:b|Front squat:w|Glute bridge:n|Glute kickback:c|Goblet squat:k|Good morning:w|Hack squat:m|Hip abduction:m|Hip adduction:m|Hip thrust:w|Jump squat:n|Lateral band walk:b|Leg curl:m|Leg extension:m|Leg press:m|Lunge:w|Pistol squat:n|Reverse lunge:w|Romanian deadlift:w|Seated calf raise:m|Single-leg deadlift:w|Squat:w|Step-up:w|Sumo deadlift:w|Sumo squat:w|Walking lunge:w|Wall sit:n`],
  core:['Core','Abs and obliques',`Ab rollout:n|Bicycle crunch:n|Cable crunch:c|Crunch:n|Dead bug:n|Flutter kick:n|Hanging knee raise:n|Hanging leg raise:n|Heel tap:n|Hollow hold:n|Leg raise:n|Mountain climber:n|Oblique crunch:n|Pallof press:c|Plank:n|Reverse crunch:n|Russian twist:w|Side plank:n|Sit-up:n|Toe touch:n|V-up:n|Weighted sit-up:w|Windshield wiper:n|Woodchop:c`],
  full:['Full body','Compound, multi-joint moves',`Bear crawl:n|Burpee:n|Clean:w|Clean and press:w|Deadlift to row:w|Devil press:w|Farmer's carry:w|High pull:w|Jumping jack:n|Kettlebell swing:k|Man maker:w|Power clean:w|Renegade row:w|Snatch:w|Squat to press:w|Thruster:w|Turkish get-up:k|Wall ball:w`]
};
const byName=(a,b)=>a.localeCompare(b,undefined,{sensitivity:'base'});
const LIB = Object.fromEntries(Object.entries(RAW).map(([k,[label,blurb,list]])=>[k,{label,blurb,
  ex:list.split('|').map(x=>{const [n,d]=x.split(':');return [n,DEF[d]]}).sort((a,b)=>byName(a[0],b[0]))}]));
const FORM = {"Arnold press": "Start with the dumbbells at your chin, palms facing you like you're holding a book to read. Turn your palms out as you press up, like a door swinging open, then swing them closed on the way down.", "Bench press": "Plant your feet like roots and pinch your shoulder blades as if holding a pencil between them. Lower the bar to the middle of your chest, then push yourself away from it into the bench.", "Bent-over row": "Tip forward like you're peering over a table edge, back flat as a tabletop. Pull the weight toward your back pocket, elbows brushing your sides, then lower slowly.", "Bicep curl": "Glue your elbows to your ribs. Curl the weight up like you're lifting a full cup to your lips, then lower it all the way down like setting it on a shelf.", "Cable crossover": "Step forward with soft elbows, like you're about to hug a big tree. Bring your hands together in front of your chest in that hugging arc, then let your arms open slowly.", "Chest dip": "Lean forward like a ski jumper. Sink until your upper arms are level with the floor, then press up without snapping your elbows straight.", "Chest fly": "Lie back with a soft bend in your elbows, like carrying a beach ball. Open your arms wide until your chest stretches, then hug the ball back together.", "Chest press": "Sit tall with your back melted into the pad. Push the handles away like you're pushing a heavy door open, then let it come back slowly.", "Chin-up": "Grab the bar palms facing you. Pull your elbows down toward your back pockets like you're bringing the bar to your collarbone, then lower to a long hang.", "Close-grip bench press": "Hands about shoulder width, elbows brushing your sides like you're carrying a tray. Lower to your lower chest, then press back up.", "Concentration curl": "Sit and rest your elbow against your inner thigh like a kickstand. Curl the weight toward your shoulder, pause, and lower slowly.", "Decline bench press": "Hook your legs in and pinch your shoulder blades together. Lower the bar to your lower chest, then press it up in a straight line, like pushing it toward the ceiling lights.", "Diamond push-up": "Touch your thumbs and pointer fingers to make a diamond under your chest. Keep your body stiff as a plank of wood and lower your chest to your hands.", "Face pull": "Set the rope at face height. Pull it toward your forehead and spread your hands apart like you're showing off your biceps in a double flex.", "Front raise": "Stand tall with soft elbows. Lift the weight in front of you like you're pointing at the horizon, stop at shoulder height, then lower slowly.", "Hammer curl": "Hold the weights like two hammers, thumbs up. Keep your elbows at your sides, curl up, then lower like you're setting the hammers down gently.", "Incline bench press": "Set the bench at a slight hill. Lower the bar to the top of your chest, just under your collarbones, and press up with your shoulder blades tucked in your back pockets.", "Incline dumbbell fly": "On the incline, open your arms wide like spreading wings, elbows soft, until your chest stretches. Then wrap them back together like a big hug.", "Lat pulldown": "Grab a little wider than your shoulders and lean back slightly, like settling into a recliner. Pull the bar to your upper chest by driving your elbows into your back pockets, then let it float up.", "Lateral raise": "Stand tall with soft elbows. Lift your arms out to the sides like you're pouring two pitchers of water, stop at shoulder height, then lower slowly.", "Overhead press": "Squeeze your belly and glutes like you're bracing for a gentle push. Press the weight straight up until your arms frame your ears, then lower to your shoulders.", "Overhead tricep extension": "Hold the weight overhead, elbows pointing at the ceiling like antennas. Lower it behind your head by bending only your elbows, then reach back up to the sky.", "Pec deck": "Sit tall with your back against the pad. Bring the handles together like closing a big set of double doors, squeeze, then let them open slowly.", "Preacher curl": "Drape the backs of your arms over the pad like a towel over a railing. Curl the weight up, squeeze, then lower until your arms are almost straight.", "Pull-up": "Grab the bar palms facing away, a little wider than your shoulders. Pull your chest up toward the bar like you're climbing out of a pool, then lower to a long hang.", "Pullover": "Lie across the bench holding one weight over your chest. Lower it back behind your head in a big rainbow arc, then pull it back over your chest.", "Push-up": "Hands under your shoulders and your body one long line, like a surfboard. Lower your chest toward the floor as one piece, then push the floor away.", "Rear delt fly": "Tip forward with a flat back. With soft elbows, lift your arms out to the sides like you're spreading wings, squeeze your upper back, then lower.", "Reverse curl": "Hold the weight with palms facing down, like holding handlebars. Keep your elbows at your sides, curl up, then lower slowly.", "Seated cable row": "Sit tall like a rower. Pull the handle to your belly button and squeeze your shoulder blades like closing a book, then reach forward without slumping.", "Shoulder press": "Start with the weights at your shoulders like you're holding two trays. Press straight up until your arms are long, then lower back to the trays.", "Shrug": "Let the weights hang at your sides. Lift your shoulders toward your ears like saying 'I don't know', pause, then let them sink down.", "Single-arm row": "Brace one hand and knee on the bench, back flat like a table. Pull the weight toward your hip like starting a lawnmower slowly, then lower until your arm is long.", "Skull crusher": "Hold the weight over your chest. Bend only at the elbows to lower it toward your forehead like tipping a drawbridge down, then raise it back up.", "Straight-arm pulldown": "Face the cable with long arms. Sweep the bar down to your thighs like smoothing a tablecloth, then let it rise slowly.", "T-bar row": "Tip forward with a flat back. Pull the handle to your chest and squeeze your shoulder blades like cracking a walnut between them, then lower.", "Tricep dip": "Hands on the bench behind you, fingers pointing toward your feet. Sink until your elbows make a right angle, elbows pointing back like car mirrors, then press up.", "Tricep kickback": "Tip forward with your upper arm pinned to your side. Straighten your arm back like pushing a door closed behind you, squeeze, then return.", "Tricep pushdown": "Pin your elbows to your sides. Push the handle down until your arms are straight, like pressing a plunger, then let it rise to chest height.", "Upright row": "Hold the weight in front of your thighs. Pull it up along your body like zipping up a jacket, elbows leading, then lower slowly.", "Box jump": "Stand a foot from the box. Swing your arms, jump, and land softly like a cat with bent knees. Step down instead of jumping down.", "Bulgarian split squat": "Rest your back foot on the bench behind you. Sink straight down like an elevator, front knee over your shoelaces, then rise back up.", "Calf raise": "Stand on the balls of your feet. Rise up like you're reaching for a high shelf, pause, then lower your heels slowly.", "Clamshell": "Lie on your side with knees bent and feet together. Open your top knee like a clamshell opening, feet still touching, then close it slowly.", "Curtsy lunge": "Step one leg back and across, like a polite curtsy. Sink until your front thigh is nearly level, then push back to standing.", "Deadlift": "Feet under your hips, bar over your shoelaces. Hinge with a flat back, then stand up like you're pushing the floor away, bar brushing your legs the whole way.", "Donkey kick": "On hands and knees, keep one knee bent and press that foot up like stamping a footprint on the ceiling. Squeeze your glute, then lower.", "Fire hydrant": "On hands and knees, lift one bent knee out to the side like opening a gate, without leaning, then lower.", "Front squat": "Rest the bar on the front of your shoulders, elbows high like you're showing off a shelf. Sink straight down, chest tall, then drive back up.", "Glute bridge": "Lie back with knees bent and feet flat. Press through your heels and lift your hips until you're a straight ramp from knees to shoulders. Squeeze, then lower.", "Glute kickback": "Tip forward slightly. Push one leg straight back like closing a car door with your heel, squeeze, and keep your lower back still.", "Goblet squat": "Hug the weight to your chest like a warm mug. Sink down between your heels, elbows inside your knees, then stand tall.", "Good morning": "Bar across your upper back, knees soft. Bow forward at the hips with a flat back like greeting someone politely, until your hamstrings stretch, then stand.", "Hack squat": "Shoulders under the pads, feet shoulder width. Sink until your thighs are level with the platform, then press through your whole foot.", "Hip abduction": "Sit tall and press your knees out against the pads like opening a book. Pause, then close slowly.", "Hip adduction": "Sit tall and squeeze your knees together like closing a book. Pause, then let them open slowly.", "Hip thrust": "Upper back on the bench, weight across your hips. Drive through your heels until your body is a flat tabletop, chin tucked, and squeeze.", "Jump squat": "Sink down like you're about to sit, then spring up like popcorn. Land softly with bent knees and flow right into the next one.", "Lateral band walk": "Band above your knees, sit into a half squat. Step sideways like you're sneaking along a wall, keeping the band tight and toes forward.", "Leg curl": "Line your knees up with the machine's hinge. Curl your heels toward your glutes like kicking sand behind you, squeeze, then lower slowly.", "Leg extension": "Sit with your knees at the hinge. Straighten your legs like kicking a ball gently, squeeze your thighs, then lower with control.", "Leg press": "Feet shoulder width on the platform. Lower until your knees make a right angle with your back glued to the pad, then press up without locking your knees.", "Lunge": "Step forward like taking a long stride. Lower until both knees make right angles, torso tall like a candle, then push back through your front heel.", "Pistol squat": "Stand on one leg with the other reaching forward like a kickstand. Lower slowly as far as you can control, then drive back up.", "Reverse lunge": "Step back like you're stepping off a curb behind you. Lower until both knees make right angles, then push through your front heel to stand.", "Romanian deadlift": "Soft knees, flat back. Push your hips back like closing a drawer with your behind, slide the weight down your legs until your hamstrings stretch, then stand tall.", "Seated calf raise": "Pads resting on your lower thighs. Lift your heels like you're tiptoeing, pause, then lower for a full stretch.", "Single-leg deadlift": "Balance on one leg with a soft knee. Tip forward like a seesaw as your back leg reaches behind you, hips level like headlights pointing at the floor, then rise.", "Squat": "Feet shoulder width, toes turned slightly out. Reach your hips back like you're easing onto a low chair behind you, chest proud like there's a logo on your shirt you want to show off. Knees follow your toes.", "Step-up": "Place your whole foot on the box. Press through that heel and stand up like climbing a tall stair, then step down slowly.", "Sumo deadlift": "Wide stance, toes out, hands inside your knees. Chest proud, then push the floor apart with your feet as you stand.", "Sumo squat": "Wide stance, toes out like a ballet second position. Sink straight down, pushing your knees out over your toes, then rise and squeeze your glutes.", "Walking lunge": "Take a long stride and sink until both knees make right angles, then step through into the next one like walking down a hallway.", "Wall sit": "Back flat on the wall, slide down like sitting on an invisible chair until your knees make right angles. Weight in your heels, and hold.", "Ab rollout": "Kneel holding the wheel. Roll forward slowly like stretching out on a sheet of ice, back flat and belly tight, then pull back with your abs.", "Bicycle crunch": "Hands lightly behind your head. Bring one elbow toward the opposite knee as the other leg reaches long, like pedaling a slow bike.", "Cable crunch": "Kneel with the rope beside your head. Curl your ribs toward your hips like rolling up a yoga mat, without pulling with your arms.", "Crunch": "Lie with knees bent and hands lightly behind your head. Curl your shoulders up like peeking over your knees, then lower slowly.", "Dead bug": "Lie on your back, arms up and knees bent like a bug on its back. Lower the opposite arm and leg while your lower back stays pressed into the floor.", "Flutter kick": "Lie back with your lower back pressed down. Keep your legs long and kick in small quick strokes like swimming.", "Hanging knee raise": "Hang still like a coat on a hook. Pull your knees up toward your chest, then lower slowly.", "Hanging leg raise": "Hang with long legs. Lift them to hip height or higher like a drawbridge rising, then lower without swinging.", "Heel tap": "Lie with knees bent and shoulders lifted. Reach side to side like a windshield wiper to tap each heel.", "Hollow hold": "Lie back and lift your shoulders and long legs off the floor, shaped like a shallow banana. Press your lower back down and hold.", "Leg raise": "Lie flat with hands under your hips. Raise long legs to point at the ceiling, then lower slowly without your back arching.", "Mountain climber": "Start in a high plank. Drive one knee toward your chest, then switch like running in place, hips level like a table.", "Oblique crunch": "Drop your knees to one side. Crunch up toward your hip like wringing out a towel, then lower.", "Pallof press": "Stand side-on to the cable with the handle at your chest. Press it straight out and stay still like a const COACHES={

  steady:{label:'Steady',blurb:'Even, grounded and supportive.',file:'voices/steady.json'},
  bright:{label:'Bright',blurb:'Upbeat with a little bounce.',file:'voices/bright.json'},

const CLIPS={}, CLIP_STATE={};
function coachState(id){return CLIP_STATE[id]||'none'}

function talkSecs(items){const cs=clipSet();return items.reduce((s,x)=>s+((cs&&cs[x.k])?cs[x.k].d:speechSecs(x.t||'')-2),0)+2}

const PREFIX={'First up, ':'firstUp','Up next, ':'upNext','Next set, ':'nextSet'};
const formItems=(it,prefix)=>[{k:PREFIX[prefix],t:LINES.cue[PREFIX[prefix]]},{k:'tip:'+it.name,t:it.name+'. '+formFor(it)}];

function phase(name,dur){ W.phase=name; W.dur=dur; W.acc=0; W.since=performance.now(); W.lastSec=-1; W.repNow=0; }
function elapsed(){return W.acc+(W.paused?0:performance.now()-W.since)}
function totalMs(){return W.total+(W.paused?0:performance.now()-W.totalSince)}
function cur(){return W.queue[W.qi]}

function loop(){
  if(!W||W.paused||S.screen!=='workout')return;
  const t=elapsed()/1000, s=Math.floor(t), p=S.plan;
  if(W.phase==='work'){
    const reps=cur().it.reps;
    if(s!==W.lastSec){
      W.lastSec=s;
      if(s===0){cue.go();}
      else if(s%p.pace===0){
        const k=s/p.pace; W.repNow=k; say(k);
        if(k>=reps){finishSet();return;}
        cue.rep(); bump('.rep');
      } else cue.tick();
    }
  } else { // ready or rest: countdown
    const left=W.dur-t;
    if(s!==W.lastSec){
      W.lastSec=s; const l=Math.ceil(left);
      if(W.phase!=='brief'&&l<=3&&l>0){cue.count(); bump('.clock');}
    }
    if(left<=0){ if(W.phase==='brief'){phase('ready',3);renderWorkout();return;} phase('work',0); say('Go'); renderWorkout(); return;}
  }
  paint();
}
function finishSet(){
  W.setsDone++; W.repsDone+=W.repNow; cue.setDone();
  W.qi++;
  if(W.qi>=W.queue.length){endWorkout();return;}
  phase('rest',S.plan.rest); renderWorkout();
  const nx=cur(), done=W.queue[W.qi-1]; const lead=restLine(done,nx);
  setTimeout(()=>{if(W&&W.phase==='rest'&&!W.paused)readForm(nx.it,nx.set===1?'Up next, ':'Next set, ',lead);},900);
}
function endWorkout(){
  W.total=totalMs(); W.paused=true; clearInterval(timer); talk([pickLine('done')]);
  try{wake&&wake.release()}catch(e){} S.screen='done'; render();
}
function bump(sel){const el=$app.querySelector(sel);if(!el)return;el.classList.remove('pulse');void el.offsetWidth;el.classList.add('pulse')}

function renderWorkout(){
  const c=cur(), isWork=W.phase==='work', isRest=W.phase==='rest';
  const nextUp=isRest?c:null;
  $app.innerHTML=`<header><span class="step">Total <span id="tot">0:00</span></span><span style="flex:1"></span>
      <button class="chip" data-a="mute" aria-pressed="${!muted}">${muted?'Sound off':'Sound on'}</button></header>
    <main class="wo ${isRest?'is-rest':''}">
      <div class="track"><b style="width:${W.qi/W.queue.length*100}%"></b></div>
      <div class="wo-top">
        <span class="phase">${isWork?'Work':isRest?'Rest':W.phase==='brief'?'Form check':'Get ready'}</span>
        <p class="wo-name">${esc(c.it.name)}</p>
        <span class="wo-meta">${EQUIP[c.it.equip]}${WEIGHTED(c.it.equip)&&c.it.weight>0?` ${c.it.weight} ${S.plan.unit}`:''} · Set ${c.set} of ${c.it.sets} · ${c.it.reps} reps</span>
      </div>
      <div class="clock" id="clock">0:00</div>
      ${isWork?`<div class="rep">Rep <b id="repn">1</b> / ${c.it.reps}</div>
        <div class="beat"><b id="beat"></b></div>
        <div class="dots" id="dots">${Array.from({length:c.it.reps},()=>'<i></i>').join('')}</div>`
      :`<p class="next">${isRest?'Up next: ':''}${esc(c.it.name)}, set ${c.set}</p>
        <div class="tip"><span class="lbl">How to do it</span><p>${esc(formFor(c.it))}</p></div>`}
    </main>
    <div class="bar"><div class="ctrls">
      <button class="primary" data-a="pause">${W.paused?'Resume':'Pause'}</button>
      ${isWork?`<button class="ghost" data-a="finish">Finish set</button>`:`<button class="ghost" data-a="skip">${isRest?'Skip rest':W.phase==='brief'?'Skip':'Start now'}</button>`}
      <button class="ghost" data-a="end">${W.confirmEnd?'Tap again to end':'End workout'}</button>
    </div></div>`;
  paint();
}
function paint(){
  if(S.screen!=='workout')return;
  const t=elapsed()/1000, p=S.plan;
  const clock=document.getElementById('clock'); if(!clock)return;
  document.getElementById('tot').textContent=fmt(totalMs()/1000);
  if(W.phase==='work'){
    clock.textContent=fmt(t);
    const reps=cur().it.reps, done=Math.min(reps,Math.floor(t/p.pace));
    document.getElementById('repn').textContent=Math.min(reps,done+1);
    document.getElementById('beat').style.width=((t%p.pace)/p.pace*100)+'%';
    const dots=document.getElementById('dots').children;
    for(let i=0;i<dots.length;i++)dots[i].classList.toggle('on',i<done);
  } else {
    clock.textContent=W.phase==='brief'?'':W.phase==='ready'?String(Math.max(1,Math.ceil(W.dur-t))):fmt(Math.ceil(W.dur-t));
  }
}

/* ---------- Events ---------- */
$app.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]'); if(!b)return;
  const a=b.dataset.a, p=S.plan;
  const go=sc=>{S.screen=sc;if(sc==='volume')loadCoach(S.plan.coach);render();window.scrollTo(0,0)};
  switch(a){
    case 'plan': S.plan=freshPlan(); go('category'); break;
    case 'repeat': { const l=load(); if(l){S.plan=Object.assign(freshPlan(),l); if(!COACHES[S.plan.coach])S.plan.coach='smoky'; S.plan.items.forEach(x=>{if(!EQUIP[x.equip])x.equip='none'}); go('volume');} break; }
    case 'home': go('home'); break;
    case 'back': { const i=STEPS.indexOf(S.screen); go(i>0?STEPS[i-1]:'home'); break; }
    case 'cat': if(p.category!==b.dataset.k){p.category=b.dataset.k;p.items=[];} go('exercises'); break;
    case 'ex': { const n=b.dataset.n, i=p.items.findIndex(x=>x.name===n);
      if(i>=0) p.items.splice(i,1);
      else { const def=LIB[p.category].ex.find(x=>x[0]===n); p.items.push({name:n,equip:def?def[1]:'weights',sets:3,reps:10}); }
      render(); break; }
    case 'next': go(STEPS[STEPS.indexOf(S.screen)+1]); break;
    case 'eq': p.items[+b.dataset.i].equip=b.dataset.e; render(); break;
    case 'inc': case 'dec': { const it=p.items[+b.dataset.i], k=b.dataset.k, max=k==='sets'?10:50;
      it[k]=Math.min(max,Math.max(1,it[k]+(a==='inc'?1:-1))); render(); break; }
    case 'pace': p.pace=+b.dataset.v; render(); break;
    case 'rest': p.rest=+b.dataset.v; render(); break;
    case 'voice': p.voice=!p.voice; render(); break;
    case 'tips': p.tips=!p.tips; render(); break;
    case 'style': p.coachStyle=b.dataset.v; render(); break;
    case 'coach': p.coach=b.dataset.v; stopTalk(); loadCoach(p.coach); render(); break;
    case 'unit': p.unit=b.dataset.v; render(); break;
    case 'preview': { const it=p.items[0]||{name:'Squat'}; if(p.coach!=='device'&&coachState(p.coach)==='loading')break; talk([{k:'preview',t:"Let's go."},{k:'tip:'+it.name,t:it.name+'. '+formFor(it)}]); break; }
    case 'start': startWorkout(); break;
    case 'pause':
      audioInit();
      if(W.paused){W.paused=false;W.since=performance.now();W.totalSince=performance.now();}
      else{W.acc=elapsed();W.total=totalMs();W.paused=true;stopTalk();}
      renderWorkout(); break;
    case 'finish': W.repNow=Math.min(cur().it.reps,Math.floor(elapsed()/1000/p.pace)); finishSet(); break;
    case 'skip': stopTalk(); if(W.phase==='brief'){phase('ready',3);} else {phase('work',0); say('Go');} renderWorkout(); break;
    case 'mute': muted=!muted; if(muted){stopTalk();} renderWorkout(); break;
    case 'end':
      if(W.confirmEnd){endWorkout();}
      else{W.confirmEnd=true;renderWorkout();setTimeout(()=>{if(W&&S.screen==='workout'){W.confirmEnd=false;renderWorkout();}},3000);}
      break;
  }
});
$app.addEventListener('change',e=>{ if(e.target.id==='coachVoice'){S.plan.coachVoice=e.target.value;} });
$app.addEventListener('input',e=>{ if(e.target.classList.contains('wt')){const v=parseFloat(e.target.value);S.plan.items[+e.target.dataset.i].weight=v>0?v:0;} });
try{speechSynthesis.addEventListener('voiceschanged',()=>{if(S.screen==='volume')render();});}catch(e){}
$app.addEventListener('submit',e=>{
  e.preventDefault(); const inp=document.getElementById('customEx'); const n=inp.value.trim().replace(/\s+/g,' ');
  if(!n)return; const p=S.plan;
  if(!p.items.some(x=>byName(x.name,n)===0)){
    const known=LIB[p.category].ex.find(x=>byName(x[0],n)===0);
    p.items.push(known?{name:known[0],equip:known[1],sets:3,reps:10}:{name:n,equip:'weights',sets:3,reps:10,custom:true});
  }
  render(); document.getElementById('customEx').focus();
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.screen==='workout'){audioInit();lockScreen();}});
render();
</script>
