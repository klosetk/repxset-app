<meta charset="utf-8">
<title>Rep Counter</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow phone-first column; header with back + step, content, sticky action bar at the bottom. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --fg:#11151D; --muted:#5A6374; --line:#DADFE8;
  --accent:#2A4BDB; --accent-fg:#FFFFFF; --accent-soft:#E3E8FC;
  --rest:#0B8F72; --rest-soft:#DDF3EC;
  --edge:color-mix(in srgb,var(--fg) 40%,var(--surface));
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0F15; --surface:#151922; --fg:#EDF0F5; --muted:#8E97A8; --line:#252B37;
  --accent:#7290FF; --accent-fg:#0C0F15; --accent-soft:#1C2445;
  --rest:#3CCFA6; --rest-soft:#0F2A24; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0F15; --surface:#151922; --fg:#EDF0F5; --muted:#8E97A8; --line:#252B37;
  --accent:#7290FF; --accent-fg:#0C0F15; --accent-soft:#1C2445;
  --rest:#3CCFA6; --rest-soft:#0F2A24; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding-block:14px 6px;min-height:56px}
.back{background:none;border:1px solid var(--line);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;flex:none}
.step{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-size:14px}
main{flex:1;display:flex;flex-direction:column;gap:18px;padding-block:8px 24px}
h1{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0;letter-spacing:.01em}
.sub{color:var(--muted);margin:0}
.list{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;width:100%;
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px}
.opt .t{font-weight:600;font-size:18px}
.opt .d{color:var(--muted);font-size:14px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.check{width:24px;height:24px;border-radius:7px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.opt[aria-pressed="true"] .check{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--edge);background:transparent;border-radius:999px;padding:8px 14px;font-weight:500;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--edge);background:transparent;font-size:22px;line-height:1}
.stepper output{font-family:var(--display);font-weight:700;font-size:28px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.field{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px}
.tip p{margin:0;font-size:17px;line-height:1.45}
select.field{appearance:auto}
.note{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px dashed var(--muted);color:var(--muted);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.bar{position:sticky;bottom:0;padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.primary{width:100%;border:0;border-radius:14px;background:var(--accent);color:var(--accent-fg);font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.04em;text-transform:uppercase;padding:16px}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:1.5px solid var(--edge);border-radius:14px;padding:14px;font-weight:600}

/* Home */
.home{justify-content:center;gap:28px}
.mark{font-family:var(--display);font-weight:700;font-size:72px;line-height:.9;letter-spacing:-.02em;margin:0}
.mark span{color:var(--accent)}
.plates{display:flex;gap:6px;align-items:center}
.plates i{display:block;width:10px;border-radius:3px;background:var(--fg)}
.last{font-size:14px;color:var(--muted)}

/* Workout */
.wo{gap:14px;text-align:center}
.wo-top{display:flex;flex-direction:column;gap:4px;align-items:center}
.wo-name{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;margin:0}
.wo-meta{color:var(--muted);font-weight:500}
.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.track>b{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.phase{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.14em;font-size:16px;color:var(--accent)}
.wo.is-rest .phase{color:var(--rest)}
.clock{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums;font-size:min(34vw,170px);line-height:.9;letter-spacing:-.02em}
.wo.is-rest .clock{color:var(--rest)}
.rep{font-family:var(--display);font-weight:600;font-size:30px;font-variant-numeric:tabular-nums}
.rep b{font-size:56px;font-weight:700}
.pacebar{display:flex;align-items:center;justify-content:center;gap:12px;margin:0 0 10px;font-variant-numeric:tabular-nums}.pacebar span{color:var(--muted);min-width:96px;text-align:center}.pacebar b{color:var(--fg);font-size:18px}.pacebar .chip[disabled]{opacity:.4}
.fixlink{align-self:center;background:none;border:0;color:var(--muted);font-size:15px;padding:10px;min-height:44px}.fixlink u{color:var(--accent);font-weight:600}
.fixbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;text-align:left}.fixbox p{margin:0;color:var(--muted);font-size:14.5px}
.fixrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.capslot:not(.on){display:none}
/* Workout fills the screen: content scrolls between the header and the controls, so nothing hides under Pause. */
.app.wo-mode{height:100vh;height:100dvh;min-height:0}.app.wo-mode main.wo{overflow-y:auto;min-height:0;padding-bottom:12px}.app.wo-mode .bar{position:static;background:var(--bg)}
.wo.is-rest{gap:10px}
.wo.is-rest .clock{font-size:min(24vw,112px)}
.rep.side{font-size:26px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
.beat{height:10px;background:var(--line);border-radius:10px;overflow:hidden;max-width:320px;width:100%;margin:0 auto}
.beat>b{display:block;height:100%;background:var(--accent);width:0}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:340px;margin:0 auto}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--edge)}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.next{color:var(--muted);font-size:15px}
.ctrls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctrls .primary{grid-column:1/-1}
.pulse{animation:pulse .18s ease-out}
@keyframes pulse{from{transform:scale(1.04)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}.track>b{transition:none}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.field.wt{width:120px;flex:none;text-align:right}
/* Tabs, saved list, analytics */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:12px}
.tabs button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:600;font-size:15px;color:var(--muted)}
.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--fg)}
.home .tabs{align-self:stretch}
.ctrl3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.ctrl3 .ghost{padding:10px 6px;font-size:15px}
.primary.sm{font-size:18px;padding:10px}
.ghost.sm2{padding:8px 14px;border-radius:999px;font-size:15px;flex:none}
.row.wrap{flex-wrap:wrap}
.ok{color:var(--rest)}
.wg{gap:10px}
.chart{width:100%;height:auto;display:block}
.chart .b{fill:var(--accent);opacity:.45}.chart .b-now{fill:var(--accent)}
.chart .axis{stroke:var(--line)}.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .dot{fill:var(--surface);stroke:var(--accent);stroke-width:2.5}
.chart .l{fill:var(--muted);font:500 11px var(--body)}.chart .v{fill:var(--fg);font:600 12px var(--body)}
.stats.st4{grid-template-columns:repeat(4,1fr);gap:8px}.st4 .stat{padding:10px 4px}.st4 .stat b{font-size:26px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week span{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--line);font-weight:600;font-size:14px;color:var(--muted)}
.week span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tbl{display:flex;flex-direction:column}
.tr{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.tr:first-child{border-top:0;padding-top:0}
.hb{display:flex;flex-direction:column;gap:8px}
.hb-r{display:grid;grid-template-columns:minmax(0,1.2fr) 1fr auto;gap:10px;align-items:center;font-size:15px}
.hb-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t{height:10px;background:var(--line);border-radius:10px;overflow:hidden}.hb-t b{display:block;height:100%;background:var(--accent);border-radius:10px}
.hb-v{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.opt.ed{padding:10px 10px 10px 14px}
.ed-t{display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;flex:1;padding:4px 0}
.ed-t[aria-pressed="true"] .check{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.mv{display:flex;gap:6px}.mv button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:transparent;font-size:18px}
.mv button:disabled{opacity:.3;cursor:default}
@media (max-width:380px){.stats.st4{grid-template-columns:repeat(2,1fr)}}
.hdr{gap:6px}.hdr .chip{padding:6px 11px;font-size:14px}
.cap{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));width:min(520px,calc(100% - 32px));z-index:5;
  background:rgba(10,12,18,.88);color:#fff;border-radius:12px;padding:10px 14px;font-size:18px;line-height:1.4;text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.cap-who{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:26px;flex:none}
.danger{border-color:#D14343}.danger-btn{color:#D14343;border-color:#D14343}
.gfilter{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.gfilter::-webkit-scrollbar{display:none}
.gtab{flex:none;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-weight:600;font-size:15px;white-space:nowrap}
.gtab[aria-selected="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.gdot{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none}
.gtab[aria-selected="true"] .gdot{box-shadow:0 0 0 2px var(--bg)}
.gstack{display:inline-flex}.gstack i{width:10px;height:10px;border-radius:50%;margin-left:-3px;box-shadow:0 0 0 1.5px var(--surface)}.gstack i:first-child{margin-left:0}
.gtags{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:5px}
.gtag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted);font-weight:500}
.gtag .gdot{width:8px;height:8px}
.galign{display:flex;align-items:baseline;gap:10px}.galign b{font-family:var(--display);font-size:40px;line-height:1}.galign span{color:var(--muted);font-size:14px}
.gchip{display:inline-flex;align-items:center;gap:6px}.gchip[aria-pressed="true"]{background:var(--gc);border-color:var(--gc);color:#fff}
.obdots{display:flex;gap:6px}.obdots i{flex:1;height:5px;border-radius:5px;background:var(--line)}.obdots i.on{background:var(--accent)}
.how{gap:14px}.how-i{display:flex;gap:12px;align-items:flex-start}.how-i b{font-weight:600}.how-i p{margin:2px 0 0;color:var(--muted);font-size:14.5px;line-height:1.45}
.bell{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer}
.bell b{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-size:12px;display:grid;place-items:center}
.homebar{display:flex;justify-content:flex-end;margin-bottom:-8px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.days .chip{padding:10px 0;min-width:0;justify-content:center}
.stime{display:flex;align-items:center;justify-content:space-between;gap:10px}.stime input{max-width:150px}
.msg{display:flex;flex-direction:column;gap:8px}.msg.new{border-color:var(--accent)}
.msg-h{display:flex;align-items:center;gap:10px}.msg-h .avatar{width:40px;height:40px;font-size:17px}
.msg-h .who{flex:1;min-width:0}.msg-h .who b{display:block}.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.msg q{quotes:none;color:var(--fg);font-size:15.5px;line-height:1.45;flex:1}
.bub{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:10px 10px 10px 14px;max-width:92%}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-color:var(--accent);border-radius:16px 16px 4px 16px;padding:10px 14px;font-weight:600}
.play{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;cursor:pointer}
.ans{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ans button:last-child{grid-column:1/-1}
.banner{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 32px));z-index:9;
  display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border-radius:16px;border:1px solid var(--accent);background:var(--surface);color:var(--fg);box-shadow:0 10px 30px rgba(0,0,0,.18);cursor:pointer;font:inherit}
.banner[hidden]{display:none}.banner .avatar{width:40px;height:40px;font-size:17px;flex:none}.banner span{flex:1}.banner small{display:block;color:var(--muted);font-size:13px}
.thms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thms.two{grid-template-columns:repeat(2,1fr)}
.thm{display:flex;flex-direction:column;gap:6px;align-items:stretch;padding:6px;border-radius:14px;border:1.5px solid var(--line);background:transparent;text-align:center;min-width:0}
.thm[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.thm-p{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:28px 14px;gap:4px;padding:6px;border-radius:9px;background:var(--tb)}
.thm-p i{grid-column:1/-1;border-radius:6px;background:var(--ts);border:1px solid color-mix(in srgb,var(--tf) 12%,transparent)}
.thm-p b{border-radius:5px;background:var(--ta)}.thm-p u{border-radius:5px;background:var(--tr)}
.thm-n{font-size:13px;font-weight:600;line-height:1.2}
.how-n{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:14px}
.chip{min-height:44px}.hdr .chip{min-height:40px}.stepper button,.back,.mv button{width:44px;height:44px}
.chip.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cg-ask{display:flex;flex-direction:column;gap:8px;padding-top:4px;border-top:1px solid var(--line)}
.capslot{min-height:0;border-radius:12px;font-size:17px;line-height:1.4;text-align:center;padding:0 12px;transition:background .2s}
.capslot.on{background:var(--fg);color:var(--bg);padding:10px 14px}.capslot .cap-who{opacity:.65}
.wo.is-paused .clock{opacity:.35}.wo.is-paused .phase{color:var(--muted)}
.wo.is-brief .clock{display:none}
</style>

<div class="app" id="app"></div>

<script>
const EQUIP = {weights:'Weights', cable:'Cable machine', band:'Resistance band', kettlebell:'Kettlebell', machine:'Machine', none:'None'};
const DEF = {w:'weights',c:'cable',b:'band',k:'kettlebell',m:'machine',n:'none'};
// "Name:default equipment" — every exercise can still use any equipment.
const RAW = {
  upper:['Upper body','Chest, back, shoulders, arms',`Arnold press:w|Bench press:w|Bent-over row:w|Bicep curl:w|Cable crossover:c|Chest dip:n|Chest fly:w|Chest press:m|Chin-up:n|Close-grip bench press:w|Concentration curl:w|Decline bench press:w|Diamond push-up:n|Face pull:c|Front raise:w|Hammer curl:w|Incline bench press:w|Incline dumbbell fly:w|Lat pulldown:c|Lateral raise:w|Overhead press:w|Overhead tricep extension:w|Pec deck:m|Preacher curl:w|Pull-up:n|Pullover:w|Push-up:n|Rear delt fly:w|Reverse curl:w|Seated cable row:c|Shoulder press:w|Shrug:w|Single-arm row:w|Skull crusher:w|Straight-arm pulldown:c|T-bar row:w|Tricep dip:n|Tricep kickback:w|Tricep pushdown:c|Upright row:w`],

const FORM = {"Arnold press": "Start with the dumbbells at your chin, palms facing you like you're holding a book to read. Turn your palms out as you press up, like a door swinging open, then swing them closed on the way down.", "Bench press": "Plant your feet like roots and pinch your shoulder blades as if holding a pencil between them. Lower the bar to the middle of your chest, then push yourself away from it into the bench.", "Bent-over row": "Tip forward like you're peering over a table edge, back flat as a tabletop. Pull the weight toward your back pocket, elbows brushing your sides, then lower slowly.", "Bicep curl": "Glue your elbows to your ribs. Curl the weight up like you're lifting a full cup to your lips, then lower it all the way down like setting it on a shelf.", "Cable crossover": "Step forward with soft elbows, like you're about to hug a big tree. Bring your hands together in front of your chest in that hugging arc, then let your arms open slowly.", "Chest dip": "Lean forward like a ski jumper. Sink until your upper arms are level with the floor, then press up without snapping your elbows straight.", "Chest fly": "Lie back with a soft bend in your elbows, like carrying a beach ball. Open your arms wide until your chest stretches, then hug the ball back together.", "Chest press": "Sit tall with your back melted into the pad. Push the handles away like you're pushing a heavy door open, then let it come back slowly.", "Chin-up": "Grab the bar palms facing you. Pull your elbows down toward your back pockets like you're bringing the bar to your collarbone, then lower to a long hang.", "Close-grip bench press": "Hands about shoulder width, elbows brushing your sides like you're carrying a tray. Lower to your lower chest, then press back up.", "Concentration curl": "Sit and rest your elbow against your inner thigh like a kickstand. Curl the weight toward your shoulder, pause, and lower slowly.", "Decline bench press": "Hook your legs in and pinch your shoulder blades together. Lower the bar to your lower chest, then press it up in a straight line, like pushing it toward the ceiling lights.", "Diamond push-up": "Touch your thumbs and pointer fingers to make a diamond under your chest. Keep your body stiff as a plank of wood and lower your chest to your hands.", "Face pull": "Set the rope at eye level and step back until your arms are long. Pull the rope toward your forehead, spreading the ends apart past your ears, elbows high, like showing off your biceps in a double flex. Squeeze your upper back, then let the rope travel back slowly.", "Front raise": "Stand tall with soft elbows. Lift the weight in front of you like you're pointing at the horizon, stop at shoulder height, then lower slowly.", "Hammer curl": "Hold the weights like two hammers, thumbs up. Keep your elbows at your sides, curl up, then lower like you're setting the hammers down gently.", "Incline bench press": "Set the bench at a slight hill. Lower the bar to the top of your chest, just under your collarbones, and press up with your shoulder blades tucked in your back pockets.", "Incline dumbbell fly": "On the incline, open your arms wide like spreading wings, elbows soft, until your chest stretches. Then wrap them back together like a big hug.", "Lat pulldown": "Grab a little wider than your shoulders and lean back slightly, like settling into a recliner. Pull the bar to your upper chest by driving your elbows into your back pockets, then let it float up.", "Lateral raise": "Stand tall with soft elbows. Lift your arms out to the sides like you're pouring two pitchers of water, stop at shoulder height, then lower slowly.", "Overhead press": "Squeeze your belly and glutes like you're bracing for a gentle push. Press the weight straight up until your arms frame your ears, then lower to your shoulders.", "Overhead tricep extension": "Hold the weight overhead, elbows pointing at the ceiling like antennas. Lower it behind your head by bending only your elbows, then reach back up to the sky.", "Pec deck": "Sit tall with your back against the pad. Bring the handles together like closing a big set of double doors, squeeze, then let them open slowly.", "Preacher curl": "Drape the backs of your arms over the pad like a towel over a railing. Curl the weight up, squeeze, then lower until your arms are almost straight.", "Pull-up": "Grab the bar palms facing away, a little wider than your shoulders. Pull your chest up toward the bar like you're climbing out of a pool, then lower to a long hang.", "Pullover": "Lie with your upper back across a bench, holding one dumbbell with both hands over your chest, elbows slightly bent. Lower it back over your head in a slow rainbow until you feel a stretch along your sides and chest. Pull it back up over your chest along the same arc.", "Push-up": "Hands under your shoulders and your body one long line, like a surfboard. Lower your chest toward the floor as one piece, then push the floor away.", "Rear delt fly": "Tip forward with a flat back. With soft elbows, lift your arms out to the sides like you're spreading wings, squeeze your upper back, then lower.", "Reverse curl": "Hold the weight with palms facing down, like holding handlebars. Keep your elbows at your sides, curl up, then lower slowly.", "Seated cable row": "Sit tall like a rower. Pull the handle to your belly button and squeeze your shoulder blades like closing a book, then reach forward without slumping.", "Shoulder press": "Start with the weights at your shoulders like you're holding two trays. Press straight up until your arms are long, then lower back to the trays.", "Shrug": "Let the weights hang at your sides. Lift your shoulders toward your ears like saying 'I don't know', pause, then let them sink down.", "Single-arm row": "Brace one hand and knee on the bench, back flat like a table. Pull the weight toward your hip like starting a lawnmower slowly, then lower until your arm is long.", "Skull crusher": "Hold the weight over your chest. Bend only at the elbows to lower it toward your forehead like tipping a drawbridge down, then raise it back up.", "Straight-arm pulldown": "Face the cable with the bar at head height and step back. Tip forward slightly with arms long and elbows soft. Sweep the bar down in an arc to your thighs, like smoothing out a tablecloth, feeling the sides of your back work. Let it rise slowly to head height.", "T-bar row": "Tip forward with a flat back. Pull the handle to your chest and squeeze your shoulder blades like cracking a walnut between them, then lower.", "Tricep dip": "Hands on the bench behind you, fingers pointing toward your feet. Sink until your elbows make a right angle, elbows pointing back like car mirrors, then press up.", "Tricep kickback": "Tip forward with your upper arm pinned to your side. Straighten your arm back like pushing a door closed behind you, squeeze, then return.", "Tricep pushdown": "Pin your elbows to your sides. Push the handle down until your arms are straight, like pressing a plunger, then let it rise to chest height.", "Upright row": "Hold the weight in front of your thighs. Pull it up along your body like zipping up a jacket, elbows leading, then lower slowly.", "Box jump": "Stand about a foot from the box, feet hip-width. Swing your arms back as you dip into a quarter squat, then swing them forward and jump. Land softly on the whole foot in a squat, like a cat, then stand tall. Step down one foot at a time.", "Bulgarian split squat": "Rest your back foot on the bench behind you. Sink straight down like an elevator, front knee over your shoelaces, then rise back up.", "Calf raise": "Stand on the balls of your feet. Rise up like you're reaching for a high shelf, pause, then lower your heels slowly.", "Clamshell": "Lie on your side with knees bent and feet together. Open your top knee like a clamshell opening, feet still touching, then close it slowly.", "Curtsy lunge": "Stand tall with feet hip-width. Step your right foot back and behind your left, like a polite curtsy. Sink until your front thigh is nearly level with the floor, front knee over your shoelaces. Push through your front heel to stand, then switch sides.", "Deadlift": "Feet under your hips, bar over your shoelaces. Hinge with a flat back, then stand up like you're pushing the floor away, bar brushing your legs the whole way.", "Donkey kick": "On hands and knees, keep one knee bent and press that foot up like stamping a footprint on the ceiling. Squeeze your glute, then lower.", "Fire hydrant": "On hands and knees, lift one bent knee out to the side like opening a gate, without leaning, then lower.", "Front squat": "Rest the bar on the front of your shoulders, elbows high like you're showing off a shelf. Sink straight down, chest tall, then drive back up.", "Glute bridge": "Lie back with knees bent and feet flat. Press through your heels and lift your hips until you're a straight ramp from knees to shoulders. Squeeze, then lower.", "Glute kickback": "Tip forward slightly. Push one leg straight back like closing a car door with your heel, squeeze, and keep your lower back still.", "Goblet squat": "Hug the weight to your chest like a warm mug. Sink down between your heels, elbows inside your knees, then stand tall.", "Good morning": "Rest the bar across your upper back, feet hip-width, knees soft. Push your hips back and bow forward with a flat back, like greeting someone politely, until your chest is nearly level with the floor or your hamstrings stretch. Squeeze your glutes to stand back up tall.", "Hack squat": "Shoulders under the pads, feet shoulder width. Sink until your thighs are level with the platform, then press through your whole foot.", "Hip abduction": "Sit tall and press your knees out against the pads like opening a book. Pause, then close slowly.", "Hip adduction": "Sit tall and squeeze your knees together like closing a book. Pause, then let them open slowly.", "Hip thrust": "Upper back on the bench, weight across your hips. Drive through your heels until your body is a flat tabletop, chin tucked, and squeeze.", "Jump squat": "Sink down like you're about to sit, then spring up like popcorn. Land softly with bent knees and flow right into the next one.", "Lateral band walk": "Loop the band just above your knees and sink into a half squat, chest up, toes forward. Step one foot out to the side, then follow with the other foot, never letting your feet touch. Keep the band tight the whole time, like sneaking along a wall. Walk one way, then back.", "Leg curl": "Line your knees up with the machine's hinge. Curl your heels toward your glutes like kicking sand behind you, squeeze, then lower slowly.", "Leg extension": "Sit with your knees at the hinge. Straighten your legs like kicking a ball gently, squeeze your thighs, then lower with control.", "Leg press": "Feet shoulder width on the platform. Lower until your knees make a right angle with your back glued to the pad, then press up without locking your knees.", "Lunge": "Step forward like taking a long stride. Lower until both knees make right angles, torso tall like a candle, then push back through your front heel.", "Pistol squat": "Stand on one leg and reach the other leg straight out in front like a kickstand, arms forward for balance. Sink slowly, hips back, letting your heel stay flat, as low as you can control. Drive through your standing heel to rise. Hold onto a doorframe or sit to a box until you're steady.", "Reverse lunge": "Step back like you're stepping off a curb behind you. Lower until both knees make right angles, then push through your front heel to stand.", "Romanian deadlift": "Soft knees, flat back. Push your hips back like closing a drawer with your behind, slide the weight down your legs until your hamstrings stretch, then stand tall.", "Seated calf raise": "Pads resting on your lower thighs. Lift your heels like you're tiptoeing, pause, then lower for a full stretch.", "Single-leg deadlift": "Balance on one leg with a soft knee. Tip forward like a seesaw as your back leg reaches behind you, hips level like headlights pointing at the floor, then rise.", "Squat": "Feet shoulder width, toes turned slightly out. Reach your hips back like you're easing onto a low chair behind you, chest proud like there's a logo on your shirt you want to show off. Knees follow your toes.", "Step-up": "Place your whole foot on the box. Press through that heel and stand up like climbing a tall stair, then step down slowly.", "Sumo deadlift": "Wide stance, toes out, hands inside your knees. Chest proud, then push the floor apart with your feet as you stand.", "Sumo squat": "Wide stance, toes out like a ballet second position. Sink straight down, pushing your knees out over your toes, then rise and squeeze your glutes.", "Walking lunge": "Take a long stride and sink until both knees make right angles, then step through into the next one like walking down a hallway.", "Wall sit": "Back flat on the wall, slide down like sitting on an invisible chair until your knees make right angles. Weight in your heels, and hold.", "Ab rollout": "Kneel holding the wheel. Roll forward slowly like stretching out on a sheet of ice, back flat and belly tight, then pull back with your abs.", "Bicycle crunch": "Hands lightly behind your head. Bring one elbow toward the opposite knee as the other leg reaches long, like pedaling a slow bike.", "Cable crunch": "Kneel with the rope beside your head. Curl your ribs toward your hips like rolling up a yoga mat, without pulling with your arms.", "Crunch": "Lie with knees bent and hands lightly behind your head. Curl your shoulders up like peeking over your knees, then lower slowly.", "Dead bug": "Lie on your back, arms reaching to the ceiling, knees bent at right angles above your hips. Press your lower back into the floor. Slowly lower your right arm overhead and straighten your left leg toward the floor, hovering just above it. Bring them back and switch sides.", "Flutter kick": "Lie back with your lower back pressed down. Keep your legs long and kick in small quick strokes like swimming.", "Hanging knee raise": "Hang still like a coat on a hook. Pull your knees up toward your chest, then lower slowly.", "Hanging leg raise": "Hang with long legs. Lift them to hip height or higher like a drawbridge rising, then lower without swinging.", "Heel tap": "Lie with knees bent and shoulders lifted. Reach side to side like a windshield wiper to tap each heel.", "Hollow hold": "Lie on your back, arms reaching past your head. Press your lower back into the floor, then lift your shoulders, arms and straight legs a few inches off the floor, shaped like a shallow banana. Hold there and breathe. Bend your knees to make it easier.", "Leg raise": "Lie flat with hands under your hips. Raise long legs to point at the ceiling, then lower slowly without your back arching.", "Mountain climber": "Start in a high plank. Drive one knee toward your chest, then switch like running in place, hips level like a table.", "Oblique crunch": "Drop your knees to one side. Crunch up toward your hip like wringing out a towel, then lower.", "Pallof press": "Stand side-on to the cable, feet hip-width, handle held at the middle of your chest with both hands. Press it straight out in front of you until your arms are long. The cable will try to twist you toward it; stay still like a statue. Pause, bring it back to your chest, and repeat. Switch sides after your set.", "Plank": "Forearms under your shoulders, body one long line like a wooden board. Squeeze your glutes and belly so your hips don't sag like a hammock.", "Reverse crunch": "Lie with knees bent over your hips. Curl your hips toward your chest like rolling up the end of a carpet, then lower slowly.", "Russian twist": "Sit leaning back, chest proud. Rotate side to side like a washing machine, bringing your hands beside each hip.", "Side plank": "Elbow under your shoulder, body a straight line like a ramp. Lift your hips and hold without letting them droop.", "Sit-up": "Knees bent and feet anchored. Roll all the way up to sitting like waking up in bed, then lower slowly back down.", "Toe touch": "Lie back with legs pointing at the ceiling. Reach your hands toward your toes like grabbing a high branch, then lower.", "V-up": "Lie long with arms overhead. Fold your legs and torso up to meet like a book closing, then lower with control.", "Weighted sit-up": "Hold the weight at your chest, knees bent. Roll up to sitting, then lower slowly like easing back into a pillow.", "Windshield wiper": "Lie on your back, arms out wide and palms down. Lift your legs straight up toward the ceiling. Keeping your shoulders pressed to the floor, lower both legs slowly to one side, stopping before they touch, then sweep them back through the middle and over to the other side.", "Woodchop": "Set the cable high on one side and stand side-on, feet wide. Grab the handle with both hands above your shoulder. Pull it diagonally down across your body to the outside of your opposite knee, like swinging an axe, turning your chest and pivoting your back foot. Return slowly along the same line.", "Bear crawl": "Start on hands and knees, then lift your knees an inch off the floor, back flat enough to balance a cup of tea. Step your right hand and left foot forward a few inches together, then your left hand and right foot. Keep your hips low and your steps small.", "Burpee": "From standing, squat and place your hands flat on the floor just in front of your feet. Hop your feet back into a plank and lower your chest to the floor. Push up, hop your feet back to your hands, and jump straight up, reaching for the ceiling. Land softly and flow into the next one.", "Clean": "Start like a deadlift, bar over your shoelaces, back flat. Stand up with the bar sliding up your thighs, then jump your hips forward and shrug hard, like trying to throw the bar to the ceiling. Pull yourself under it, whip your elbows forward, and catch it resting on the front of your shoulders.", "Clean and press": "Clean the weight to your shoulders: stand it up from the floor, pop your hips, and catch it at your collarbones with elbows forward. Brace like someone might nudge your belly, then press it straight up until your arms frame your ears. Lower to your shoulders, then back to the floor.", "Deadlift to row": "Hold the weights in front of your thighs. Push your hips back like closing a drawer behind you until your back is flat and tilted forward. Row the weights to your lower ribs, squeeze your shoulder blades, lower them, then stand back up tall. That's one rep.", "Devil press": "Stand over two dumbbells. Squat down, hands on the dumbbells, hop back to a plank, and lower your chest to the floor. Hop your feet back in wide, flat back, then swing the dumbbells back between your legs like a kettlebell swing and snap your hips so they float all the way overhead. Lower them and go again.", "Farmer's carry": "Pick up heavy weights from the floor with a flat back, one in each hand at your sides, like two full grocery bags. Stand tall, shoulders back and down, belly tight. Walk with short, steady steps, without letting the weights swing or your body lean. Set them down with a flat back.", "High pull": "Hold the weight in front of your thighs, knees soft. Tip forward slightly, then snap your hips forward and pull the weight up along your body to chest height, elbows flaring high and wide like wings. Lower it with control back to your thighs.", "Jumping jack": "Jump your feet wide as your arms sweep overhead like making a snow angel standing up, then jump back. Land softly.", "Kettlebell swing": "Stand with feet a bit wider than your hips, the bell a foot in front of you. Hinge, grab it, and hike it back between your legs like a football snap. Snap your hips forward and squeeze your glutes so the bell floats up to chest height. Your arms are just ropes; your hips do the work.", "Man maker": "Start standing with a dumbbell in each hand. Squat down, set the dumbbells on the floor under your shoulders, and hop your feet back into a plank. Do one push-up, then row the right dumbbell to your hip and the left, keeping your hips still like a tabletop. Hop your feet up to the weights, stand up as you swing them to your shoulders, and press them overhead. That's one rep.", "Power clean": "Set up like a deadlift with the bar over your shoelaces. Push the floor away until the bar reaches mid-thigh, then explode your hips forward like a jump and shrug. Drop into a quarter squat as your elbows whip forward, catching the bar on the front of your shoulders, then stand tall.", "Renegade row": "Set up in a high plank with your hands on two dumbbells, feet wider than your hips for balance. Row one dumbbell up to your hip, elbow brushing your side, while your hips stay level like headlights pointing at the floor. Set it down softly and row the other side.", "Snatch": "Wide grip, bar or dumbbell over your shoelaces, flat back. Stand up smoothly, then jump your hips forward and pull the weight close to your body like zipping a jacket. Punch your arm straight up and drop under it into a quarter squat, catching it locked out overhead, then stand.", "Squat to press": "Weights at your shoulders, sink into a squat, then rise and press them overhead like popping out of a pool.", "Thruster": "Hold the weights at your shoulders, elbows forward. Sink into a full squat, chest proud. Drive up hard out of the bottom, and as your legs straighten, let that push carry the weights straight overhead in one smooth wave. Bring them back to your shoulders as you sink into the next squat.", "Turkish get-up": "Lie on your back holding the weight straight up in your right hand, right knee bent, eyes on the weight like a lantern. Roll onto your left elbow, then your left hand. Lift your hips, sweep your left leg back into a kneel, then stand up. Reverse every step slowly to lie back down.", "Wall ball": "Stand an arm's length from the wall, ball at your chest. Sink into a full squat, chest proud. Drive up and use that spring to toss the ball to a target spot high on the wall, like shooting a basketball. Catch it at your chest and sink straight into the next squat.", "Air bike": "Sit tall with a soft grip on the handles. Push and pull the arms while you pedal, like rowing and cycling at the same time. Go hard for the whole interval, then ease off.", "Battle ropes": "Hold a rope end in each hand, feet hip-width, knees soft like a quarter squat. Whip your arms up and down in fast waves, like shaking out two big beach towels. Keep your chest up and let your legs absorb the bounce.", "Brisk walk": "Walk tall like a string is lifting the top of your head. Swing your arms from the shoulders, heel to toe, at a pace where you can talk but not sing.", "Butt kicks": "Jog in place and flick your heels up toward your back pockets, like kicking sand off your shoes. Stay light on the balls of your feet with your arms pumping.", "Elliptical": "Stand tall with your whole foot on the pedals, like gliding across ice. Push and pull the handles in rhythm with your legs, without leaning on them.", "High knees": "Run in place and drive each knee up to hip height, like stepping over a row of tall boxes. Land softly on the balls of your feet and pump your arms.", "Incline treadmill walk": "Set a steep hill and walk tall without holding the rails, like hiking up a trail. Push through your whole foot and let your arms swing naturally.", "Jump rope": "Elbows close to your sides, turn the rope with small circles from your wrists, like stirring two pots. Hop just high enough to clear it, landing quietly on the balls of your feet.", "Lateral shuffle": "Sink into a low athletic stance, like a defender guarding a basketball player. Shuffle sideways with quick steps, feet never crossing, then change direction.", "Outdoor run": "Run tall with a slight forward lean, like you're being pulled by a gen let W=null, timer=null;
function startWorkout(){
  const p=S.plan, queue=[];

  W={queue,qi:0,phase:null,acc:0,since:0,paused:false,lastSec:-1,total:0,totalSince:performance.now(),setsDone:0,repsDone:0,repNow:0,confirmEnd:false};
  W.prSaid={}; W.log=p.items.map(()=>({sets:0,reps:0,secs:0})); const best=loadBest(); p.items.forEach(it=>{it.tier=tierFor(it,p.unit,best)});

function phase(name,dur){ W.phase=name; W.dur=dur; W.acc=0; W.since=performance.now(); W.lastSec=-1; W.repNow=0; W.base=0; W.baseT=0; }

function totalMs(){return W.total+(W.paused?0:performance.now()-W.totalSince)}
function cur(){return W.queue[W.qi]}

function loop(){
  if(!W||W.paused||S.screen!=='workout')return;
  const t=elapsed()/1000, s=Math.floor(t), p=S.plan;
  if(W.phase==='work'&&cur().it.secs){
    const it=cur().it;
    if(s!==W.lastSec){ W.lastSec=s; W.repNow=s; const left=it.secs-s;
      if(s===0)cue.go();
      else if(left<=0){finishSet();return;}
      else if(left<=3){cue.count(); bump('.clock');}
      else if(it.sides&&s===Math.floor(it.secs/2)){cue.go(); bump('.clock'); talk([{k:'switch',t:'Switch sides.'}]); renderWorkout();}
      else if(it.sides&&s<Math.floor(it.secs/2)&&Math.floor(it.secs/2)-s<=3){cue.count(); bump('.clock');}
    }
  } else if(W.phase==='work'){
    const reps=cur().it.reps;
    if(s!==W.lastSec){
      W.lastSec=s;
      if(s===0){ if(!W.base)cue.go(); }
      else if(s%p.pace===0){

    }

  }

// During rest: choose which of the remaining exercises comes next.
function nextLeft(){ const seen=new Set(), out=[]; for(let i=W.qi;i<W.queue.length;i++){const it=W.queue[i].it; if(!seen.has(it)){seen.add(it); out.push(it);}} return out; }
function nextPicker(c){ const left=nextLeft(); if(left.length<2)return '';
  if(!W.pick)return `<button class="fixlink" data-a="pickOpen">Up next: ${esc(c.it.name)} · <u>Change</u></button>`;
  return `<div class="fixbox"><p>Pick what's next</p><div class="chips">${left.map(it=>{const i=S.plan.items.indexOf(it), n=W.queue.slice(W.qi).filter(q=>q.it===it).length;
    return `<button class="chip ${it===c.it?'solid':''}" data-a="pickNext" data-i="${i}" aria-pressed="${it===c.it}">${esc(it.name)}${n>1?` · ${n} sets`:''}</button>`}).join('')}</div></div>`; }
function pickNext(it){ const rest=W.queue.slice(W.qi); W.queue=W.queue.slice(0,W.qi).concat(rest.filter(q=>q.it===it),rest.filter(q=>q.it!==it)); W.pick=false;
  renderWorkout(); const nx=cur(); readForm(nx.it,'Up next, '); }
function paint(){
  if(S.screen!=='workout')return;
  const t=elapsed()/1000, p=S.plan;
  const clock=document.getElementById('clock'); if(!clock)return;
  document.getElementById('tot').textContent=fmt(totalMs()/1000);
  if(W.phase==='work'&&cur().it.secs){ const it=cur().it;
    const half=Math.floor(it.secs/2), first=it.sides&&t<half, end=it.sides?(first?half:it.secs):it.secs, start=it.sides&&!first?half:0;
    clock.textContent=fmt(Math.ceil(end-t)); document.getElementById('beat').style.width=Math.min(100,(t-start)/(end-start)*100)+'%';
  } else if(W.phase==='work'){
    const reps=cur().it.reps, done=Math.min(reps,(W.base||0)+Math.floor(t/p.pace));
    // During a set the rep count is the big number; elapsed time is secondary.
    clock.textContent=String(done); const el=document.getElementById('elap'); if(el)el.textContent=fmt(t+(W.baseT||0));
    document.getElementById('repn').textContent=Math.min(reps,done+1);
    document.getElementById('beat').style.width=((t%p.pace)/p.pace*100)+'%';
    const dots=document.getElementById('dots').children;
    for(let i=0;i<dots.length;i++)dots[i].classList.toggle('on',i<done);
  } else {
    clock.textContent=W.phase==='brief'?'':W.phase==='ready'?String(Math.max(1,Math.ceil(W.dur-t))):fmt(Math.ceil(W.dur-t));
  }
}

const userCol=()=>ST.db.collection('data/users/'+ST.uid);
function putRow(x){
  if(!ST.db){x.pending=1;cacheLocal();return;}
  const data=clone(x); delete data.pending; delete x.pending; cacheLocal();
  userCol().doc(x.id).set(data).catch(()=>{x.pending=1;cacheLocal();});
}
function dropRow(id){cacheLocal(); if(ST.db)userCol().doc(id).delete().catch(()=>{});}
async function connectStore(){
  try{
    if(!window.claude||typeof claude.use!=='function')return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return; const id=await user.id(); if(!id)return;
    ST.db=db; ST.uid=id;
    const snap=await Promise.race([userCol().limit(1000).get(),new Promise((_,r)=>setTimeout(()=>r('timeout'),10000))]);
    const rs={saved:[],logs:[],dash:null,profile:null};
    snap.docs.forEach(d=>{const x=clone(d.data()); if(!x)return; if(x.kind==='saved')rs.saved.push(x); else if(x.kind==='log')rs.logs.push(x); else if(x.kind==='dash')rs.dash=x; else if(x.kind==='profile')rs.profile=x;});
    // Rows made here while offline (pending) go up; everything else follows the server.
    const up=(local,remote)=>{const ids=new Set(remote.map(x=>x.id)); local.filter(x=>x.pending&&!ids.has(x.id)).forEach(x=>{remote.push(x);putRow(x)}); return remote;};
    ST.saved=up(ST.saved,rs.saved); ST.logs=up(ST.logs,rs.logs).sort((a,b)=>a.at-b.at);
    if(rs.dash&&!(ST.dash&&ST.dash.pending))ST.dash=rs.dash; else if(ST.dash&&(ST.dash.pending||!rs.dash))putRow(ST.dash);
    if(rs.profile&&!ST.profile.pending){ST.profile=Object.assign(freshProfile(),rs.profile); if(S.screen!=='workout')applyProfile(S.plan); if(ST.profile.onboarded&&S.screen==='onboard')S.screen='home';} else if(ST.profile.onboarded&&(ST.profile.pending||!rs.profile))putRow(ST.profile);
    fixDash(); cacheLocal(); applyTheme();
    if(['home','saved','analytics','volume','done','profile','onboard'].includes(S.screen))render();
  }catch(e){}
}
function planCopy(p){const c=clone(p); c.items.forEach(it=>{delete it.tier}); delete c.savedId; delete c.savedName; return c;}
function saveWorkout(name){
  const p=S.plan; name=(name||'').trim().replace(/\s+/g,' ').slice(0,40); if(!name)return false;
  let w=ST.saved.find(x=>x.id===p.savedId);

/* --- analytics helpers --- */
const DAY=864e5;
const wkStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const fromKg=(kg,u)=>u==='kg'?kg:kg/0.4536;
const wFmt=(kg,u)=>{const v=fromKg(kg,u);return (v>=100?Math.round(v):Math.round(v*10)/10)+' '+u};
const bigFmt=n=>n>=10000?(Math.round(n/100)/10)+'k':String(Math.round(n));
const dFmt=t=>new Date(t).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const hFmt=ms=>{const m=Math.round(ms/60000);return m<60?m+'m':Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
const RANGES={week:['7 days',7],month:['30 days',30],all:['All time',0]};
function inRange(){const d=RANGES[ST.dash.range][1];return d?ST.logs.filter(x=>x.at>=Date.now()-d*DAY):ST.logs;}
function weeks(n){const w0=wkStart(Date.now());return Array.from({length:n},(_,i)=>w0-(n-1-i)*7*DAY);}
function barChart(vals,labels,fmtV){
  const max=Math.max(1,...vals), W_=320, H=130, T=18, bw=W_/vals.length;
  return `<svg class="chart" viewBox="0 ${-T} ${W_} ${H+22+T}" role="img">${vals.map((v,i)=>{const h=Math.max(v?3:0,v/max*H);
    return `<rect x="${i*bw+bw*.18}" y="${H-h}" width="${bw*.64}" height="${h}" rx="3" class="${i===vals.length-1?'b-now':'b'}"><title>${labels[i]}: ${fmtV(v)}</title></rect>
    ${v?`<text x="${i*bw+bw/2}" y="${H-h-4}" text-anchor="middle" class="v">${fmtV(v)}</text>`:''}
    <text x="${i*bw+bw/2}" y="${H+16}" text-anchor="middle" class="l">${labels[i]}</text>`}).join('')}
    <line x1="0" x2="${W_}" y1="${H}" y2="${H}" class="axis"/></svg>`;
}
function lineChart(pts,u){
  const W_=320,H=120,pad=10, ys=pts.map(p=>p.y), lo=Math.min(...ys), hi=Math.max(...ys), span=hi-lo||1;
  const X=i=>pad+i*(W_-2*pad)/Math.max(1,pts.length-1), Y=v=>pad+(H-2*pad)*(1-(v-lo)/span);
  return `<svg class="chart" viewBox="0 0 ${W_} ${H+22}" role="img"><polyline class="ln" points="${pts.map((p,i)=>X(i)+','+Y(p.y)).join(' ')}"/>
    ${pts.map((p,i)=>`<circle cx="${X(i)}" cy="${Y(p.y)}" r="4" class="dot"><title>${dFmt(p.t)}: ${wFmt(p.y,u)}</title></circle>`).join('')}
    <text x="${pad}" y="${H+16}" class="l">${dFmt(pts[0].t)}</text><text x="${W_-pad}" y="${H+16}" text-anchor="end" class="l">${dFmt(pts[pts.length-1].t)}</text></svg>`;
}
function hbars(rows,fmtV){const max=Math.max(1,...rows.map(r=>r[1]));
  return `<div class="hb">${rows.map(([n,v])=>`<div class="hb-r"><span class="hb-n">${esc(n)}</span><span class="hb-t"><b style="width:${v/max*100}%"></b></span><span class="hb-v">${fmtV(v)}</span></div>`).join('')}</div>`;}

      <p class="sub" style="margin:0"><b>${days.size}</b> day${days.size===1?'':'s'} this week · <b>${n}</b> week streak</p>`);}

  if(k==='bests'){const b={}; Object.entries(loadBest()).forEach(([n,kg])=>b[n]=kg); ST.logs.forEach(x=>x.items.forEach(i=>{if(i.wkg>(b[i.name]||0))b[i.name]=i.wkg}));

function sessions(from,to){const sc=prof().schedule||{},out=[];const d=new Date(from);d.setHours(0,0,0,0);

function checkReminders(){

      else { const max=k==='sets'?10:50; it[k]=Math.min(max,Math.max(1,it[k]+(up?1:-1))); } render(); break; }
    case 'pace': p.pace=+b.dataset.v; render(); break;
    case 'rest': p.rest=+b.dataset.v; render(); break;
    case 'voice': profSet(x=>{x.voice=!x.voice}); render(); break;
    case 'tips': profSet(x=>{x.tips=!x.tips}); render(); break;
    case 'style': profSet(x=>{x.coachStyle=b.dataset.v}); render(); break;
    case 'coach': profSet(x=>{x.coach=b.dataset.v}); stopTalk(); loadCoach(b.dataset.v); render(); break;
    case 'pGoal': profSet(x=>{const g=goalsOf(x).slice(), v=b.dataset.v, i=g.indexOf(v); if(i>=0)g.splice(i,1); else g.push(v); x.goals=g; delete x.goal;}); render(); break;
    case 'pUnit': profSet(x=>{x.unit=b.dataset.v}); setPlanUnit(b.dataset.v); render(); break;
    case 'pSound': profSet(x=>{x.sound=b.dataset.v}); render(); audioInit(); sndDemo(); break;
    case 'pTicks': profSet(x=>{x.ticks=x.ticks===false}); render(); break;
    case 'pMix': profSet(x=>{x.mix=x.mix===false}); audioSession(); render(); break;
    case 'sndTest': audioInit(); sndDemo(); break;
    case 'skipSave': S.skipSave=true; render(); break;
    case 'clearAsk': S.confirmClear=true; render(); { const el=$app.querySelector('[data-a=clearNo]'); if(el){el.focus(); el.scrollIntoView({block:'center'});} } break;
    case 'clearNo': S.confirmClear=false; render(); break;
    case 'clearYes': clearAnalytics(); S.confirmClear=false; render(); window.scrollTo(0,0); break;
    case 'pRest': profSet(x=>{x.rest=+b.dataset.v}); p.rest=+b.dataset.v; render(); break;
    case 'pPace': profSet(x=>{x.pace=+b.dataset.v}); p.pace=+b.dataset.v; render(); break;
    case 'toProfile': S.returnTo='volume'; go('profile'); break;
    case 'backToPlan': { const r=S.returnTo||'volume'; S.returnTo=null; go(r); break; }
    case 'toProfileFrom': S.returnTo=b.dataset.v; go('profile'); break;
    case 'cg': { const n=b.dataset.n, g=b.dataset.v, t=customTags(n); setCustomTags(n,t.includes(g)?t.filter(x=>x!==g):[...t,g]); render(); break; }
    case 'sDay': { const d=b.dataset.v; profSet(x=>{const sc=Object.assign({},x.schedule||{}); if(sc[d])delete sc[d]; else sc[d]=Object.values(sc)[0]||'18:00'; x.schedule=sc; x.schedSince=x.schedSince||Date.now();}); render(); break; }
    case 'theme': profSet(x=>{x.theme=b.dataset.v}); applyTheme(); render(); break;
    case 'sRem': profSet(x=>{x.remind=b.dataset.v}); render(); break;
    case 'inbox': bannerEl.hidden=true; go('inbox'); break;
    case 'playMsg': playMsg(b.dataset.id,b.dataset.k); break;
    case 'ansMsg': answerMsg(b.dataset.id,b.dataset.v); break;
    case 'testMsg': { const n=sessions(new Date(),new Date(Date.now()+8*864e5))[0]||new Date(Date.now()+30*6e4); const m=deliver(n,true); bannerEl.hidden=true; go('inbox'); playMsg(m.id); break; }
    case 'obBack': S.ob.step=Math.max(0,S.ob.step-1); render(); window.scrollTo(0,0); break;
    case 'obNext': { const ni=document.getElementById('profName'); if(ni)ST.profile.name=ni.value.trim().slice(0,30);
      if(S.ob.step===0&&!ST.profile.name){render();break;} if(S.ob.step===1&&!goalsOf(ST.profile).length)break;
      if(S.ob.step<OB_STEPS.length-1){S.ob.step++; if(S.ob.step===3)loadCoach(ST.profile.coach); render(); window.scrollTo(0,0); break;}
      ST.profile.onboarded=true; ST.profile.created=ST.profile.created||Date.now(); if(Object.keys(ST.profile.schedule||{}).length)ST.profile.schedSince=ST.profile.schedSince||Date.now(); applyProfile(S.plan); S.plan.unit=ST.profile.unit; putRow(ST.profile); S.ob=null; go('home'); setTimeout(checkReminders,500); break; }
    case 'gf': S.goalFilter=b.dataset.v; render(); { const t=$app.querySelector(`[data-a=gf][aria-selected="true"]`); if(t){t.focus({preventScroll:true}); t.scrollIntoView({inline:'center',block:'nearest'});} } break;
    case 'unit': setPlanUnit(b.dataset.v); render(); break;
    case 'preview': { unlockAudio(); const it=p.items[0]||{name:'Squat'}; talk([{k:'preview',t:"Let's go."},formItems(it,'First up, ')[1]],true); break; }
    case 'start': startWorkout(); break;
    case 'pause':
      audioInit();
      if(W.paused){W.paused=false;W.since=performance.now();W.totalSince=performance.now();}
      else{W.acc=elapsed();W.total=totalMs();W.paused=true;stopTalk();}
      renderWorkout(); break;
    case 'finish': W.repNow=cur().it.secs?Math.min(cur().it.secs,Math.floor(elapsed()/1000)):Math.min(cur().it.reps,(W.base||0)+Math.floor(elapsed()/1000/p.pace)); finishSet(); break;
    case 'skip': stopTalk(); if(W.phase==='brief'||W.phase==='rest'){phase('ready',3);} else {phase('work',0); say('Go');} renderWorkout(); break;
    case 'mute': muted=!muted; if(muted){stopTalk();} renderWorkout(); break;
    case 'coachOn': profSet(x=>{x.coachOn=!x.coachOn}); if(!p.coachOn){try{player.pause()}catch(e){} try{speechSynthesis.cancel()}catch(e){}} render(); break;
    case 'subs': profSet(x=>{x.subs=!x.subs}); if(!p.subs){clearTimeout(capTimer);capEl.hidden=true;} render(); break;
    case 'wPace': { const np=Math.min(PACES[PACES.length-1],Math.max(PACES[0],p.pace+(+b.dataset.v))); if(np===p.pace)break;
      // Mid-set: keep the reps already counted and restart the beat at the new pace.
      if(W.phase==='work'&&!cur().it.secs){ const t=elapsed()/1000; W.base=(W.base||0)+Math.floor(t/p.pace); W.baseT=(W.baseT||0)+t; W.acc=0; W.since=performance.now(); W.lastSec=0; }
      p.pace=np; renderWorkout(); break; }
    case 'fixOpen': if(W&&W.fix){W.fix.open=!W.fix.open; renderWorkout();} break;
    case 'pickOpen': if(W){W.pick=true; renderWorkout();} break;
    case 'pickNext': { if(!W||W.phase!=='rest')break; const it=p.items[+b.dataset.i]; if(it===cur().it){W.pick=false; renderWorkout(); break;} pickNext(it); break; }
    case 'fixRep': { const f=W&&W.fix; if(!f)break; const n=Math.min(f.max,Math.max(0,f.n+(+b.dataset.v))), d=n-f.n; if(!d)break; f.n=n; W.repsDone+=d; const L=W.log[f.i]; if(L)L.reps+=d; renderWorkout(); break; }
    case 'end':
      if(W.confirmEnd){endWorkout();}
      else{W.confirmEnd=true;renderWorkout();setTimeout(()=>{if(W&&S.screen==='workout'){W.confirmEnd=false;renderWorkout();}},3000);}
      break;
  }
});
$app.addEventListener('change',e=>{ if(e.target.id==='coachVoice'){profSet(x=>{x.coachVoice=e.target.value});}
  if(e.target.matches('.stime input')&&e.target.value){ const d=e.target.dataset.d, v=e.target.value; profSet(x=>{x.schedule=Object.assign({},x.schedule,{[d]:v})}); const n=$app.querySelector('#schedCard .note'); if(n)n.textContent=nextSessionText()+' Messages arrive while the app is open, or wait in your Inbox until you next open it.'; }
  if(e.target.id==='profName'&&S.screen!=='onboard'){profSet(x=>{x.name=e.target.value.trim().slice(0,30)}); render();} if(e.target.id==='progEx'){dashSet(d=>{d.ex=e.target.value});} });
$app.addEventListener('input',e=>{ if(e.target.id==='profName'&&S.screen==='onboard'){ST.profile.name=e.target.value.trim().slice(0,30); const nb=$app.querySelector('[data-a=obNext]'); if(nb)nb.disabled=!ST.profile.name;} if(e.target.id==='pVol'){ST.profile.vol=+e.target.value;cacheLocal();clearTimeout(window._vt);window._vt=setTimeout(()=>{putRow(ST.profile);audioInit();cue.rep();},250);} if(e.target.classList.contains('wt')){const v=parseFloat(e.target.value);S.plan.items[+e.target.dataset.i].weight=v>0?v:0;} });
try{speechSynthesis.addEventListener('voiceschanged',()=>{if(S.screen==='profile')render();});}catch(e){}
$app.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='goalForm'){ const v=document.getElementById('goalIn').value.trim().replace(/\s+/g,' ').slice(0,40);
    if(v)profSet(x=>{const g=goalsOf(x).slice(); if(!g.some(y=>y.toLowerCase()===v.toLowerCase()))g.push(v); x.goals=g; delete x.goal;}); render(); document.getElementById('goalIn').focus(); return; }
  if(e.target.id==='saveForm'){ if(saveWorkout(document.getElementById('saveName').value)){S.savedFlash=true;render();} else document.getElementById('saveName').focus(); return; }
  if(e.target.id==='renameForm'){ const w=ST.saved.find(x=>x.id===e.target.dataset.id), n=document.getElementById('renameIn').value.trim().replace(/\s+/g,' ').slice(0,40);
    if(w&&n){w.name=n;w.updated=Date.now();putRow(w); if(S.plan.savedId===w.id)S.plan.savedName=n;} S.renaming=null; render(); return; }
  const inp=document.getElementById('customEx'); const n=inp.value.trim().replace(/\s+/g,' ');
  if(!n)return; const p=S.plan;
  if(!p.items.some(x=>byName(x.name,n)===0)){
    const known=LIB[p.category].ex.find(x=>byName(x[0],n)===0);
    const tc=TIMED_CATS.includes(p.category); p.items.push(timedInit(known?{name:known[0],equip:known[1],sets:3,reps:10}:{name:n,equip:tc?'none':'weights',sets:3,reps:10,custom:true},p.category));
    if(!known){ profSet(x=>{x.customEx=Object.assign({},x.customEx||{},{[n]:{cat:p.category,equip:tc?'none':'weights'}})}); S.lastCustom=n; }
    // Added while a single goal tab is open: tag it with that goal. Otherwise ask right below the form.
    const gf=S.goalFilter; if(!known&&gf&&gf!=='all'&&gf!=='mine'&&!customTags(n).includes(gf))setCustomTags(n,[...customTags(n),gf]);
  }
  render(); document.getElementById('customEx').focus();
});
$app.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='profName'&&S.screen==='onboard'){e.preventDefault(); const nb=$app.querySelector('[data-a=obNext]'); if(nb&&!nb.disabled)nb.click();} });
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.screen==='workout'){audioInit();lockScreen();} if(!document.hidden)checkReminders();});
S.plan=freshPlan(); applyTheme(); render(); connectStore().then(checkReminders); loadCoach(S.plan.coach); setInterval(checkReminders,30000);
</script>
